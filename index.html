<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mensagem para Minha Namorada 💖</title>
  <style>
    body {
      background: #ffe6f0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #d6336c;
      text-align: center;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }
    #texto {
      font-size: 1.4em;
      margin: 20px auto;
      max-width: 600px;
      line-height: 1.6;
      color: #b42e59;
      min-height: 180px;
      white-space: pre-wrap;
    }
    .carousel {
      max-width: 320px;
      margin: 20px auto;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(214, 51, 108, 0.5);
    }
    .carousel img {
      width: 100%;
      display: none;
      border-radius: 20px;
    }
    .carousel img.active {
      display: block;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .heart {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 2em;
      color: #ff2e6d;
      animation: heartBeat 1.5s infinite;
      user-select: none;
      cursor: default;
      z-index: 10;
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    /* Pétalas caindo */
    .petala {
      position: fixed;
      top: -40px;
      width: 30px;
      height: 30px;
      background: url('https://i.imgur.com/YkRgnmR.png') no-repeat center/contain;
      opacity: 0.9;
      animation-name: cair;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      pointer-events: none;
      z-index: 5;
      filter: drop-shadow(0 0 1px #d6336c);
    }
    @keyframes cair {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.9;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
    .youtube-player {
      margin: 20px auto;
      max-width: 320px;
      box-shadow: 0 5px 15px rgba(214, 51, 108, 0.5);
      border-radius: 12px;
      overflow: hidden;
    }
    #toggle-sound {
      margin: 10px auto;
      display: block;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      background: #d6336c;
      color: #fff;
      border: none;
      max-width: 320px;
      box-shadow: 0 0 8px rgba(214, 51, 108, 0.8);
    }
  </style>
</head>
<body>
  <h1>Para você, minha princesa 💖</h1>
  <p id="texto"></p>

  <div class="carousel">
    <img src="foto 0.jpg" alt="Foto 0" class="active" />
    <img src="foto 1.jpg" alt="Foto 1" />
    <img src="foto 2.jpg" alt="Foto 2" />
    <img src="foto 3.jpg" alt="Foto 3" />
    <img src="foto 4.jpg" alt="Foto 4" />
    <img src="foto 5.jpg" alt="Foto 5" />
    <img src="foto 6.jpg" alt="Foto 6" />
    <img src="foto 7.jpg" alt="Foto 7" />
    <img src="foto 8.jpg" alt="Foto 8" />
    <img src="foto 9.jpg" alt="Foto 9" />
  </div>

  <div class="youtube-player">
    <iframe width="320" height="180" src="https://www.youtube.com/embed/51lOFuCR7dE?autoplay=1&loop=1&playlist=51lOFuCR7dE&mute=1" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>

  <button id="toggle-sound">🔈 Ativar Som</button>

  <div class="heart">❤️</div>

  <script>
    // Máquina de escrever
    const texto = `Maria Clara,

Desde que você entrou na minha vida, tudo ganhou mais cor, mais sentido e mais alegria. Seu sorriso ilumina meus dias e seu jeito doce me faz acreditar que o amor verdadeiro existe. Com você, aprendi que estar junto é construir sonhos, compartilhar momentos e crescer lado a lado.

Quero ser aquele que te apoia em cada desafio, que celebra suas conquistas e que te abraça mesmo quando o mundo parecer difícil. Você é meu porto seguro, minha inspiração e a razão do meu coração bater mais forte.

Maria Clara, eu te amo de um jeito simples, mas intenso. Quero caminhar com você pela vida, escrevendo nossa história com amor, carinho e respeito. Obrigado por ser quem você é e por me deixar fazer parte da sua vida.

Para sempre seu,
Sávio Felipe
 🌹`;

    const textoElemento = document.getElementById('texto');
    let index = 0;

    function escrever() {
      if (index < texto.length) {
        textoElemento.textContent += texto.charAt(index);
        index++;
        setTimeout(escrever, 40);
      }
    }
    escrever();

    // Carrossel de fotos
    const images = document.querySelectorAll('.carousel img');
    let current = 0;

    function showNextImage() {
      images[current].classList.remove('active');
      current = (current + 1) % images.length;
      images[current].classList.add('active');
    }
    setInterval(showNextImage, 4000);

    // Controle de som do YouTube
    const toggleSoundBtn = document.getElementById('toggle-sound');
    const ytplayer = document.querySelector('iframe');
    let isMuted = true;

    toggleSoundBtn.addEventListener('click', () => {
      if (isMuted) {
        ytplayer.src = ytplayer.src.replace('mute=1', 'mute=0');
        toggleSoundBtn.textContent = '🔇 Mudo';
        isMuted = false;
      } else {
        ytplayer.src = ytplayer.src.replace('mute=0', 'mute=1');
        toggleSoundBtn.textContent = '🔈 Ativar Som';
        isMuted = true;
      }
    });

    // Criar pétalas caindo
    function criarPetala() {
      const petala = document.createElement('div');
      petala.classList.add('petala');
      petala.style.left = Math.random() * window.innerWidth + 'px';
      petala.style.animationDuration = (5 + Math.random() * 5) + 's';
      petala.style.opacity = 0.7 + Math.random() * 0.3;
      document.body.appendChild(petala);

      setTimeout(() => {
        petala.remove();
      }, 10000);
    }

    setInterval(criarPetala, 300);
  </script>
</body>
</html>
