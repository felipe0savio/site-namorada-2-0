<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mensagem para Minha Namorada 💖</title>
  <style>
    body {
      background: #ffe6f0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #d6336c;
      text-align: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }

    p {
      font-size: 1.4em;
      margin: 20px auto;
      max-width: 600px;
      line-height: 1.6;
      color: #b42e59;
    }

    .carousel {
      max-width: 320px;
      margin: 20px auto;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(214, 51, 108, 0.5);
    }

    .carousel img {
      width: 100%;
      display: none;
      border-radius: 20px;
    }

    .carousel img.active {
      display: block;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Corações animados */
    .heart {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 2em;
      color: #ff2e6d;
      animation: heartBeat 1.5s infinite;
      user-select: none;
      cursor: default;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <h1>Para você, meu amor 💖</h1>
  <p>
    Todo dia ao seu lado é um presente.  
    Obrigado por ser essa luz na minha vida e me fazer sorrir sem motivo.  
    Te amo demais, minha linda! 🌹
  </p>

  <div class="carousel">
    <img src="foto1.jpg" alt="Foto 1" class="active" />
    <img src="foto2.jpg" alt="Foto 2" />
    <img src="foto3.jpg" alt="Foto 3" />
    <img src="foto4.jpg" alt="Foto 4" />
    <img src="foto5.jpg" alt="Foto 5" />
  </div>

  <div class="heart">❤️</div>

  <script>
    const images = document.querySelectorAll('.carousel img');
    let current = 0;

    function showNextImage() {
      images[current].classList.remove('active');
      current = (current + 1) % images.length;
      images[current].classList.add('active');
    }

    setInterval(showNextImage, 4000); // troca a cada 4 segundos
  </script>
</body>
</html>
