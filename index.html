<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mensagem para Minha Namorada 💖</title>
  <style>
    /* seu CSS aqui (mantive seu original) */
    body {
      background: #ffe6f0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #d6336c;
      text-align: center;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }
    /* ... (outros estilos mantidos) ... */
    .carousel {
      max-width: 320px;
      margin: 0 auto 30px auto;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(214, 51, 108, 0.5);
      z-index: 1;
    }

    .carousel img {
      width: 100%;
      display: none;
      border-radius: 20px;
    }

    .carousel img.active {
      display: block;
    }
    /* resto do CSS mantido */
  </style>
</head>
<body>

  <button id="btnAbrir">CLIQUE AQUI💖</button>

  <div id="conteudo" style="display:none;">
    <h1>Para você, minha princesa 💖</h1>
    
    <div id="contador-namoro"></div>

    <div class="carousel">
      <img src="foto 0.jpg" alt="Foto 0" class="active" />
      <img src="foto 1.jpg" alt="Foto 1" />
      <img src="foto 2.jpg" alt="Foto 2" />
      <img src="foto 3.jpg" alt="Foto 3" />
      <img src="foto 4.jpg" alt="Foto 4" />
      <img src="foto 5.jpg" alt="Foto 5" />
      <img src="foto 6.jpg" alt="Foto 6" />
      <img src="foto 7.jpg" alt="Foto 7" />
      <img src="foto 8.png" alt="Foto 8" />
      <img src="foto 9.png" alt="Foto 9" />
    </div>

    <p id="texto"></p>

    <audio id="musica" loop>
      <source src="sol.mpeg" type="audio/mpeg" />
    </audio>

    <div class="heart">❤️</div>
  </div>

  <script>
    const btnAbrir = document.getElementById('btnAbrir');
    const conteudo = document.getElementById('conteudo');
    const musica = document.getElementById('musica');

    btnAbrir.addEventListener('click', () => {
      btnAbrir.style.display = 'none';
      conteudo.style.display = 'block';
      musica.play().catch(() => {
        console.log("Clique para liberar a reprodução da música.");
      });
      iniciarSite();
    });

    function iniciarSite() {
      const dataInicioNamoro = new Date('2024-03-28T21:31:00');

      function atualizarContador() {
        const agora = new Date();

        let anos = agora.getFullYear() - dataInicioNamoro.getFullYear();

        const aniversarioEsteAno = new Date(agora.getFullYear(), dataInicioNamoro.getMonth(), dataInicioNamoro.getDate(), dataInicioNamoro.getHours(), dataInicioNamoro.getMinutes(), dataInicioNamoro.getSeconds());
        if (agora < aniversarioEsteAno) {
          anos--;
        }

        const ultimoAniversario = new Date(dataInicioNamoro);
        ultimoAniversario.setFullYear(dataInicioNamoro.getFullYear() + anos);

        let diff = agora - ultimoAniversario;

        const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
        diff -= dias * (1000 * 60 * 60 * 24);

        const horas = Math.floor(diff / (1000 * 60 * 60));
        diff -= horas * (1000 * 60 * 60);

        const minutos = Math.floor(diff / (1000 * 60));
        diff -= minutos * (1000 * 60);

        const segundos = Math.floor(diff / 1000);

        const textoContador = `Estamos juntos há ${anos} ano${anos !== 1 ? 's' : ''}, ${dias} dia${dias !== 1 ? 's' : ''}, ${horas} hora${horas !== 1 ? 's' : ''}, ${minutos} minuto${minutos !== 1 ? 's' : ''} e ${segundos} segundo${segundos !== 1 ? 's' : ''} ❤️`;

        document.getElementById('contador-namoro').textContent = textoContador;
      }
      setInterval(atualizarContador, 1000);
      atualizarContador();

      const textos = [
        `Maria Clara,

Desde que você entrou na minha vida, tudo ganhou mais cor, mais sentido e mais alegria. Seu sorriso ilumina meus dias e seu jeito doce me faz acreditar que o amor verdadeiro existe. Com você, aprendi que estar junto é construir sonhos, compartilhar momentos e crescer lado a lado.

Quero ser aquele que te apoia em cada desafio, que celebra suas conquistas e que te abraça mesmo quando o mundo parecer difícil. Você é meu porto seguro, minha inspiração e a razão do meu coração bater mais forte.

Maria Clara, eu te amo de um jeito simples, mas intenso. Quero caminhar com você pela vida, escrevendo nossa história com amor, carinho e respeito. Obrigado por ser quem você é e por me deixar fazer parte da sua vida.

Para sempre seu,
Sávio Felipe
🌹`
      ];

      const textoElemento = document.getElementById('texto');
      let textoIndex = 0;

      const images = document.querySelectorAll('.carousel img');
      let current = 0;

      function avancar() {
        images[current].classList.remove('active');
        current = (current + 1) % images.length;
        images[current].classList.add('active');

        textoIndex = (textoIndex + 1) % textos.length;
        textoElemento.textContent = textos[textoIndex];
      }

      textoElemento.textContent = textos[textoIndex];

      document.body.addEventListener('click', avancar);

      // Aqui troca automaticamente a foto/texto a cada 2 segundos
      setInterval(avancar, 2000);
    }
  </script>
</body>
</html>
